<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Zeiss Medical Diagnostic Laboratory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f4f7f6;
    }
    .login-container {
      display: flex;
      width: 1000px;
      height: 600px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .login-image {
      flex: 1;
      background-image: url('https://images.unsplash.com/photo-1579154204601-01588f351e67?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .login-image::after {
      content: "Zeiss Medical Diagnostic Laboratory";
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
    }
    .login-form {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-form h2 {
      font-weight: 800;
      color: #1e1e2f;
      margin-bottom: 10px;
    }
    .form-control {
      padding: 12px;
      border-radius: 8px;
    }
    .btn-primary {
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      background-color: #0056b3;
      border: none;
    }
    .btn-primary:hover {
      background-color: #004494;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Left Side: Image -->
    <div class="login-image d-none d-md-block"></div>

    <!-- Right Side: Form -->
    <div class="login-form">
      <h2>Welcome Back</h2>
      <p class="text-muted mb-4">Please login to your account</p>

      {% if form.errors %}
        <div class="alert alert-danger py-2">Invalid username or password.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
          <label class="form-label fw-bold">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
          </div>
          <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>

        <div class="text-center">
          <p class="text-muted mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Create Account</a></p>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
