<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
  <div class="container" style="max-width: 400px;">
    <div class="card shadow p-4">
      <h3 class="text-center mb-3 font-weight-bold">Forgot Password?</h3>
      <p class="text-muted text-center small">Enter your email address and we'll send you a link to reset your password.</p>
      <form method="post">
        {% csrf_token %}
        <input type="email" name="email" class="form-control mb-3" placeholder="Email Address" required>
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
      </form>
      <p class="text-center mt-3 mb-0"><a href="{% url 'login' %}">Back to Login</a></p>
    </div>
  </div>
</body>
</html>
